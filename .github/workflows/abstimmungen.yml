name: Abstimmungen aktualisieren

on:
  schedule:
    - cron: "17 6 * * 0" # sonntags – der HowTheyVote-Export erscheint wöchentlich
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  abstimmungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Daten von HowTheyVote.eu laden
        run: npm run abrufen

      - name: Auswerten
        run: npm run auswerten

      - name: Vorschau
        run: npm run vorschau -- 5 >> "$GITHUB_STEP_SUMMARY"

      - name: Porträts laden
        run: npm run portraets

      - name: Grafiken der 3 neuesten Abstimmungen
        run: npm run grafiken

      - uses: actions/upload-artifact@v4
        with:
          name: grafiken
          path: out/**/*.png

      - name: Änderungen committen
        run: |
          git add data/abstimmungen.json data/abgeordnete.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Abstimmungen aktualisieren"
          git pull --rebase
          git push
